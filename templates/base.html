{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="ecommerce, market, shop, mart, cart, deal, multipurpose, marketplace">
    <meta name="description" content="Carrot - Multipurpose eCommerce HTML Template.">
    <meta name="author" content="ashishmaraviya">

    <title>
    {% block title %}
        
    {% endblock title %}
        </title>

    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'img/logo/favicon.png' %}">

    <!-- Icon CSS -->
    <link rel="stylesheet" href="{% static 'css/vendor/materialdesignicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/remixicon.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/flaticons.css' %}">

    <!-- Vendor -->
    <link rel="stylesheet" href="{% static 'css/vendor/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/aos.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/range-slider.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/jquery.slick.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/slick-theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/owl.carousel.min.css' %}">

    <!-- Main CSS -->
    {% block main_css %}
    {% endblock %}
    
</head>

<body class="body-bg-6">

    <!-- Loader -->
    <div id="cr-overlay">
        <span class="loader"></span>
    </div>

{% include "includes/header.html" %}

{% include 'includes/mobile-menu.html' %}

{% include 'includes/sidebar-cart.html' %}

{% block content %}

{% endblock %}

<!-- Tab to top -->
    <a href="#Top" class="back-to-top result-placeholder">
        <i class="ri-arrow-up-line"></i>
        <div class="back-to-top-wrap">
            <svg viewBox="-1 -1 102 102">
                <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"></path>
            </svg>
        </div>
    </a>

{% include "includes/footer.html" %}

<!-- Vendor Custom -->
    <script src="{% static "js/vendor/jquery-3.6.4.min.js" %}"></script>
    <script src="{% static "js/vendor/jquery.zoom.min.js" %}"></script>
    <script src="{% static "js/vendor/bootstrap.bundle.min.js" %}"></script>
    <script src="{% static "js/vendor/mixitup.min.js" %}"></script>

    <script src="{% static "js/vendor/range-slider.js" %}"></script>
    <script src="{% static "js/vendor/aos.min.js" %}"></script>
    <script src="{% static "js/vendor/swiper-bundle.min.js" %}"></script>
    <script src="{% static "js/vendor/slick.min.js" %}"></script>
    <script src="{% static "js/vendor/owl.carousel.min.js" %}"></script>
    <script src="{% static "js/vendor/countdownTimer.js" %}"></script>

    <!-- Main Custom -->
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/demo-2.js' %}"></script>
</body>

</html>
